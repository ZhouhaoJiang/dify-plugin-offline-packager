name: Bug report
description: Report a reproducible problem in a supported runtime profile
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Remove customer data, credentials, private keys, package contents, and private registry URLs before submitting.
  - type: input
    id: release
    attributes:
      label: Packager release or commit
    validations:
      required: true
  - type: dropdown
    id: profile
    attributes:
      label: Runtime profile
      options:
        - dify-compose-3.9.2
        - dify-compose-3.12.0
        - Custom runtime override
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Target platform
      options:
        - linux/amd64
        - linux/arm64
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Sanitized doctor output
      render: json
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction and observed result
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
